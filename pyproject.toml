[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "music_encoding"
version = "0.1.0"
description = "Training pipelines for music encoding models"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "torchaudio",
    "numpy",
    "datasets",
    "transformers",
    "matplotlib",
    "pillow",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "ipython",
]

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["music_encoding"]
